name: 🚀 Xiaozhi ESP32-S3 Vietnam Ultimate Build

on:
  push:
    branches:
      - develop_vn
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-firmware:
    name: 🏗 ESP32-S3 Premium Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4

      - name: 🐍 Generate Config + Patch
        shell: bash
        run: |

          cat > sdkconfig.defaults << 'EOF'
          CONFIG_ESP_CONSOLE_USB_CDC=y
          CONFIG_ESP_CONSOLE_SECONDARY_USB_CDC=y
          CONFIG_COMPILER_CXX_EXCEPTIONS=y
          CONFIG_COMPILER_CXX_RTTI=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_SPEED_80M=y
          CONFIG_SPIRAM_SIZE=8388608
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"
          CONFIG_LV_FONT_FMT_TXT_LARGE=y
          CONFIG_LV_USE_IMGFONT=y
          EOF

          cat > partitions.csv << 'EOF'
          # Name, Type, SubType, Offset, Size
          nvs,data,nvs,0x9000,0x6000
          phy_init,data,phy,0xf000,0x1000
          factory,app,factory,0x10000,6M
          storage,data,fat,,4M
          EOF

                python3 << 'PYEOF'

          import os

          targets = [
              "CMakeLists.txt",
              "main/CMakeLists.txt"
          ]

      - name: Patch Compiler Flags
        run: |
          python3 << 'PYEOF'
          import os

          targets = [
              "CMakeLists.txt",
              "main/CMakeLists.txt"
          ]

          patch = """
          set(CMAKE_C_FLAGS "${CMAKE_C_FLAGS} -Wno-error=format -Wno-error=format-extra-args -Wno-format")
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -Wno-error=format -Wno-error=format-extra-args -Wno-format")
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -fexceptions -frtti")
          """

          for file in targets:

              if not os.path.exists(file):
                  continue

              with open(file, "r", encoding="utf-8") as f:
                  content = f.read()

              if "-Wno-error=format" in content:
                  continue

              with open(file, "w", encoding="utf-8") as f:
                  f.write(content + "\n" + patch)

          print("Patch compiler flags completed")
          PYEOF
      - name: 🛠 Setup ESP-IDF & Compile
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: release-v5.4
          target: esp32s3
          command: |

            idf.py set-target esp32s3

            idf.py fullclean

            idf.py reconfigure

            idf.py build

      - name: 🧩 Generate Merged Firmware
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: release-v5.4
          target: esp32s3
          command: |

            idf.py merge-bin \
              --output factory_merged.bin \
              --format raw

            cp factory_merged.bin ../factory_merged.bin

      - name: 📦 Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-vietnam-firmware
          retention-days: 7
          path: |
            factory_merged.bin
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin

      - name: 📄 Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-logs
          path: |
            build/log/*
