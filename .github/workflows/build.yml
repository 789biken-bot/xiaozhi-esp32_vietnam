name: 🚀 Xiaozhi ESP32-S3 Vietnam Industrial Pro Pipeline

on:
push:
branches:
- develop_vn
workflow_dispatch:

permissions:
contents: write
actions: write

jobs:
build-firmware:
runs-on: ubuntu-latest

steps:
  - name: 📂 Checkout Source
    uses: actions/checkout@v4

  - name: 🐍 Patch Project
    shell: python
    run: |
      import os

      sdkconfig = r'''
      CONFIG_ESP_CONSOLE_USB_CDC=y
      CONFIG_ESP_CONSOLE_SECONDARY_USB_CDC=y

      CONFIG_SPIRAM=y
      CONFIG_SPIRAM_MODE_OCT=y

      CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y

      CONFIG_PARTITION_TABLE_CUSTOM=y
      CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"

      CONFIG_ESP_MAIN_TASK_STACK_SIZE=16384

      CONFIG_COMPILER_CXX_EXCEPTIONS=y
      CONFIG_COMPILER_CXX_RTTI=y

      CONFIG_LV_FONT_FMT_TXT_LARGE=y
      CONFIG_LV_USE_IMGFONT=y
      '''

      sdkconfig = "\n".join(
          line.strip()
          for line in sdkconfig.splitlines()
          if line.strip()
      )

      with open("sdkconfig.defaults", "w", encoding="utf-8") as f:
          f.write(sdkconfig)

      partitions = r'''
      # Name, Type, SubType, Offset, Size
      nvs,data,nvs,0x9000,0x6000
      phy_init,data,phy,0xf000,0x1000
      factory,app,factory,0x10000,6M
      storage,data,fat,,4M
      '''

      partitions = "\n".join(
          line.strip()
          for line in partitions.splitlines()
          if line.strip()
      )

      with open("partitions.csv", "w", encoding="utf-8") as f:
          f.write(partitions)

      # FIX LVGL IMG FONT ERROR
      for root, dirs, files in os.walk("."):
          for file in files:
              if file.endswith(".c") or file.endswith(".h"):
                  fp = os.path.join(root, file)

                  try:
                      with open(fp, "r", encoding="utf-8", errors="ignore") as rf:
                          txt = rf.read()

                      txt = txt.replace(
                          "lv_imgfont_create(",
                          "(lv_font_t*)lv_imgfont_create("
                      )

                      txt = txt.replace(
                          "NULL);",
                          "NULL));"
                      )

                      txt = txt.replace(
                          "bread-compact-wifi",
                          "esp32-s3-box"
                      )

                      with open(fp, "w", encoding="utf-8") as wf:
                          wf.write(txt)

                  except:
                      pass

      print("✅ PATCH DONE")

  - name: 🛠 Build Firmware
    uses: espressif/esp-idf-ci-action@v1.1.0
    with:
      esp_idf_version: release-v5.4
      target: esp32s3
      command: |
        idf.py set-target esp32s3
        idf.py fullclean
        idf.py build

  - name: 🧩 Merge Factory BIN
    uses: espressif/esp-idf-ci-action@v1.1.0
    with:
      esp_idf_version: release-v5.4
      target: esp32s3
      command: |
        cd build
        python3 -m esptool \
          --chip esp32s3 \
          merge_bin \
          -o factory_merged.bin \
          --flash_mode dio \
          --flash_size 16MB \
          @flash_args

        cp factory_merged.bin ../factory_merged.bin

  - name: 📦 Upload Firmware
    uses: actions/upload-artifact@v4
    with:
      name: xiaozhi-industrial-pro
      path: |
        factory_merged.bin
        build/bootloader/bootloader.bin
        build/partition_table/partition-table.bin
        build/*.bin
