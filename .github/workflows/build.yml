name: 🚀 Xiaozhi ESP32-S3 Vietnam Ultimate Build

on:
  push:
    branches:
      - develop_vn
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-firmware:
    name: 🏗️ Advanced Hardware Build & Validation
    runs-on: ubuntu-latest

    steps:

      - name: 📂 Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🧩 Create sdkconfig.defaults
        shell: bash
        run: |

          echo 'CONFIG_ESP_CONSOLE_USB_CDC=y' >> sdkconfig.defaults
          echo 'CONFIG_ESP_CONSOLE_SECONDARY_USB_CDC=y' >> sdkconfig.defaults

          echo 'CONFIG_COMPILER_CXX_EXCEPTIONS=y' >> sdkconfig.defaults
          echo 'CONFIG_COMPILER_CXX_RTTI=y' >> sdkconfig.defaults

          echo 'CONFIG_SPIRAM=y' >> sdkconfig.defaults
          echo 'CONFIG_SPIRAM_MODE_OCT=y' >> sdkconfig.defaults
          echo 'CONFIG_SPIRAM_SPEED_80M=y' >> sdkconfig.defaults

          echo 'CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y' >> sdkconfig.defaults

          echo 'CONFIG_PARTITION_TABLE_CUSTOM=y' >> sdkconfig.defaults
          echo 'CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"' >> sdkconfig.defaults

          echo 'CONFIG_LV_FONT_FMT_TXT_LARGE=y' >> sdkconfig.defaults
          echo 'CONFIG_LV_USE_IMGFONT=y' >> sdkconfig.defaults

      - name: 🧩 Create partitions.csv
        shell: bash
        run: |

          cat > partitions.csv << EOF
          # Name, Type, SubType, Offset, Size, Flags
          nvs,data,nvs,0x9000,0x6000,
          phy_init,data,phy,0xf000,0x1000,
          factory,app,factory,0x10000,6M,
          storage,data,fat,,4M,
          EOF

      - name: 🔧 Patch Compiler Flags
        shell: bash
        run: |

          if [ -f CMakeLists.txt ]; then
            echo 'set(CMAKE_C_FLAGS "${CMAKE_C_FLAGS} -Wno-error=format")' >> CMakeLists.txt
            echo 'set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -Wno-error=format")' >> CMakeLists.txt
            echo 'set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -Wno-error=format-extra-args")' >> CMakeLists.txt
          fi

          if [ -f main/CMakeLists.txt ]; then
            echo 'set(CMAKE_C_FLAGS "${CMAKE_C_FLAGS} -Wno-error=format")' >> main/CMakeLists.txt
            echo 'set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -Wno-error=format")' >> main/CMakeLists.txt
            echo 'set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -Wno-error=format-extra-args")' >> main/CMakeLists.txt
          fi

      - name: 🛠️ Setup ESP-IDF & Compile
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: release-v5.4
          target: esp32s3
          command: |

            echo "======================"
            echo "START BUILD"
            echo "======================"

            idf.py set-target esp32s3

            idf.py full
