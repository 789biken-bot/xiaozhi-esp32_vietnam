name: 🚀 Xiaozhi ESP32-S3 Vietnam

on:
  push:
    branches:
      - develop_vn
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-firmware:

    runs-on: ubuntu-latest

    steps:

      - name: 📂 Checkout Source
        uses: actions/checkout@v4

      - name: 🔧 Patch Display + PSRAM
        run: |

          echo "CONFIG_SPIRAM=y" >> sdkconfig.defaults
          echo "CONFIG_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
          echo "CONFIG_SPIRAM_SPEED_80M=y" >> sdkconfig.defaults

          echo "CONFIG_ESP_MAIN_TASK_STACK_SIZE=16384" >> sdkconfig.defaults

          echo "CONFIG_LV_FONT_FMT_TXT_LARGE=y" >> sdkconfig.defaults
          echo "CONFIG_LV_USE_IMGFONT=y" >> sdkconfig.defaults

          echo "CONFIG_COMPILER_CXX_EXCEPTIONS=y" >> sdkconfig.defaults
          echo "CONFIG_COMPILER_CXX_RTTI=y" >> sdkconfig.defaults

          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESPTOOLPY_FLASHMODE_DIO=y" >> sdkconfig.defaults

          cat sdkconfig.defaults

      - name: 🛠 Build Firmware
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: release-v5.4
          target: esp32s3
          command: |

            idf.py set-target esp32s3

            idf.py fullclean

            idf.py build

      - name: 🧩 Merge BIN
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: release-v5.4
          target: esp32s3
          command: |

            cd build

            python3 -m esptool --chip esp32s3 merge_bin \
            -o factory_merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            @flash_args

            cp factory_merged.bin ../factory_merged.bin

      - name: 📦 Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-firmware
          retention-days: 7
          path: |

            factory_merged.bin

            build/bootloader/bootloader.bin

            build/partition_table/partition-table.bin

            build/*.bin
